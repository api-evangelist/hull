note: >-
  Hull publishes no dedicated trust centre (no trust.hull.io, no Vanta/Drata/
  SafeBase portal — all probed 404 on 2026-08-13). Its compliance posture is
  stated on a single narrative /security/ page plus an "Enterprise features" row
  in the pricing table. Attestations are named but no report, audit window,
  auditor or certificate is published; every artifact is gated behind an email
  request to security@hull.io.
