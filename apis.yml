aid: hull
name: Hull
description: >-
  Hull is a real-time Customer Data Platform (CDP) that unifies customer data
  from every source — web, product, CRM, marketing and support tools, databases
  and files — into a single User and Account profile using claim-based identity
  resolution. It ingests, computes and enriches data through a data-lifecycle
  pipeline (Ingest / Compute / Notify), organizes people and companies into
  Segments, and syncs the resulting profiles out to more than fifty tools via
  Connectors ("ships"). Developers integrate through a flat HTTP API at
  https://{organization}.hullapp.io/api/v1 covering Users, Accounts, Events,
  Segments, Status and Bulk operations, plus first-party Node, browser, PHP and
  Ruby client libraries and an outgoing/incoming webhook surface. Hull was
  acquired by MessageBird (now Bird) and the platform was switched off at 09:00
  ET on 31 December 2022, with all infrastructure decommissioned and customer
  data deleted; the marketing site and documentation remain published but the
  API host no longer answers.
